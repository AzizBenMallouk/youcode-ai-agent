[project]
name = "newsletter-service"
version = "0.1.0"
description = "YouCode AI newsletter agent — subscription handling via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain-google-genai",
    "langchain-ollama",
    "langchain-xai",
    "langchain",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "mcp>=1.2.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
