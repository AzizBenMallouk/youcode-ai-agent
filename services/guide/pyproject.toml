[project]
name = "guide-service"
version = "0.1.0"
description = "YouCode AI guide agent — RAG-powered question answering via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain-google-genai",
    "langchain-ollama",
    "langchain-xai",
    "langchain",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-qdrant",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "qdrant-client",
    "flashrank",
    "mcp>=1.2.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
