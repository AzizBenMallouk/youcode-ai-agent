[project]
name = "gateway-service"
version = "0.1.0"
description = "YouCode AI gateway — WhatsApp webhook receiver and proxy"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
    "aio-pika>=9.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
