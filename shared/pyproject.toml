[project]
name = "youcode-shared"
version = "0.1.0"
description = "Shared infrastructure, domain models, and utilities for YouCode AI services"
requires-python = ">=3.11"
dependencies = [
    # Settings & validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Database (synchronous — SQLAlchemy ORM for business logic)
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.0",
    # LangGraph checkpointing (async PostgreSQL)
    "langgraph-checkpoint-postgres>=3.0",
    "asyncpg>=0.27",
    # LLM providers
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.1",
    "langchain-xai>=0.1",
    # HTTP client (A2A + external APIs)
    "httpx>=0.27",
    # Retry logic
    "tenacity>=8.0",
    # Email
    "email-validator>=2.0",
    "bcrypt>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
