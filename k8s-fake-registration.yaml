apiVersion: v1
kind: Service
metadata:
  name: fake-registration-api
  labels:
    app: fake-registration-api
spec:
  ports:
    - port: 9001
      targetPort: 9001
  selector:
    app: fake-registration-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-registration-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-registration-api
  template:
    metadata:
      labels:
        app: fake-registration-api
    spec:
      containers:
        - name: fake-registration-api
          image: youcode/fake-registration:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
