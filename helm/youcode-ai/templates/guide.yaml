apiVersion: apps/v1
kind: Deployment
metadata:
  name: guide
  labels:
    app: guide
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guide
  template:
    metadata:
      labels:
        app: guide
    spec:
      containers:
      - name: guide
        image: "{{ .Values.microservices.guide.image.repository }}:{{ .Values.microservices.guide.image.tag }}"
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@postgres:5432/{{ .Values.postgres.auth.database }}"
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        envFrom:
        - secretRef:
            name: youcode-secrets
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: guide
spec:
  selector:
    app: guide
  ports:
  - port: 8001
    targetPort: 8001
