services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: youcode-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: youcode-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
      - ./youcode-383711-be6f512e7af2.json:/app/youcode-383711-be6f512e7af2.json
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GOOGLE_APPLICATION_CREDENTIALS=/app/youcode-383711-be6f512e7af2.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: youcode-postgres
    environment:
      - POSTGRES_USER=youcode
      - POSTGRES_PASSWORD=youcode_pass
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: youcode-redis
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: youcode-evolution-api
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=super_secret_key
      - WEBHOOK_GLOBAL_URL=http://api:8000/api/v1/whatsapp/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBSOCKET=false
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_MESSAGE_UPSERT=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://youcode:youcode_pass@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - REDIS_URI=redis://redis:6379
    depends_on:
      - api
      - postgres
      - redis
    restart: unless-stopped

volumes:
  qdrant_data:
  evolution_instances:
  postgres_data: